<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visual QA comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; background: #0f0f0f; color: white; font-family: system-ui, sans-serif; }
      main { display: grid; gap: 24px; }
      section { display: grid; gap: 8px; }
      h2 { margin: 0; font-size: 14px; font-weight: 650; color: #aaa; }
      img { display: block; width: 100%; border: 1px solid #333; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h2>REFERENCE</h2>
        <img src="/qa/reference.png" alt="Reference design" />
      </section>
      <section>
        <h2>IMPLEMENTATION</h2>
        <img src="/qa/implementation.jpg" alt="Implementation screenshot" />
      </section>
    </main>
  </body>
</html>
